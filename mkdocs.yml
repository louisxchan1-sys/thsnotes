site_name: HKDSE 旅遊與款待 筆記
site_description: HKDSE Tourism and Hospitality Studies 溫習筆記
theme:
  name: material
  language: zh-TW
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle: {icon: material/weather-night, name: 深色模式}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle: {icon: material/weather-sunny, name: 淺色模式}
extra_css:
  - stylesheets/extra.css
  - stylesheets/print.css
extra_javascript:
  - javascripts/print.js
plugins:
  - search
  - print-site:            # 必須放最後
      add_to_navigation: true
      exclude:
        - index.md
      print_page_title: 列印全部筆記
      add_print_site_banner: false
      add_table_of_contents: true
      toc_title: 目錄
      toc_depth: 2
      add_full_urls: false
      enumerate_headings: false
      enumerate_figures: false
      add_cover_page: true
      cover_page_template: overrides/print_cover.tpl
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - abbr
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - 首頁: index.md
  - 課題一 旅遊導論:
      - 1. 「旅遊」簡介: topic1/01-intro.md
      - 2. 旅行、旅遊及旅客的定義: topic1/02-travel-tourism-tourists.md
      - 3. 旅遊的動機與旅客流量: topic1/03-motivation-tourist-flow.md
      - 4. 旅遊產品：旅遊景點與目的地: topic1/04-tourism-products-destinations.md
      - 5. 旅遊業中的不同界別及其角色: topic1/05-sectors.md
      - 6. 本地旅遊業發展: topic1/06-local-tourism.md
      - 7. 旅遊業的影響: topic1/07-impacts.md
  - 課題二 款待導論: []
  - 課題三 地理名勝: []
  - 課題四 客務關係及服務:
      - 2. 顧客服務概念: topic4/02-customer-service-concepts.md
  - 課題五 趨勢及議題: []
